<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /><title>Cross-origin image fixture</title></head>
<body>
  <h1>Cross-origin image page</h1>
  <!-- Served from a different origin (different port) with no CORS
       headers, so a fetch()+blob approach would receive an opaque
       response it can't read - the allow-rule click-to-load method
       doesn't have that problem since it never reads the bytes in JS. -->
  <img id="cross-img" src="http://localhost:8974/images/small.png" width="20" height="20" alt="cross-origin" />
</body>
</html>
