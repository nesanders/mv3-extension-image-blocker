name: Test

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: E2E tests (Playwright + Chromium)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Recent Playwright chromium builds handle headless-with-extensions
      # natively (no xvfb wrapper needed) - confirm this still holds
      # against whatever version package-lock.json pins if these jobs
      # start failing after a Playwright bump.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # TODO: add a release job that packs the extension (zip) and attaches it
  # as a build artifact on tagged commits, so a tested build is always
  # available to sideload without a local rebuild.
