<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Click-to-Load Images</title>
<style>
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    width: 260px;
    margin: 0;
    padding: 12px;
    color: #1a202c;
  }
  h1 {
    font-size: 13px;
    margin: 0 0 10px;
    color: #4a5568;
    font-weight: 600;
  }
  #site {
    font-weight: 600;
    word-break: break-all;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #eef1f4;
  }
  .row:last-of-type { border-bottom: none; }
  button.action {
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    border: 1px solid #dde2e7;
    border-radius: 4px;
    background: #f7f9fa;
    cursor: pointer;
    font: inherit;
  }
  button.action:hover { background: #eef1f4; }
  a#open-options {
    display: block;
    margin-top: 10px;
    text-align: center;
    font-size: 12px;
    color: #3a6ea5;
    text-decoration: none;
  }
</style>
</head>
<body>
  <h1>Click-to-Load Images</h1>
  <div class="row">
    <span>Block media globally</span>
    <input type="checkbox" id="global-toggle" />
  </div>
  <div class="row">
    <span>Block media on <span id="site">this site</span></span>
    <input type="checkbox" id="site-toggle" />
  </div>
  <button type="button" class="action" id="load-all">Load everything on this page</button>
  <a href="#" id="open-options">Options…</a>
  <script src="popup.js"></script>
</body>
</html>
